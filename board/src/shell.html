<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: header + Refresh, needs-you bar, legend, one big map with minimap and zoom buttons, grouped name list, bottom card. */
:root{--bg:#f1f0ec;--panel:#ffffff;--fg:#1b1b19;--muted:#67655e;--line:#dedbd2;--accent:#2457d6;--accent-fg:#fff;--bad:#d92d20;--bad-bg:#fdecea;
 --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1017;--panel:#191c27;--fg:#ecebe6;--muted:#a09fa8;--line:#2b2f3f;--accent:#7ea2ff;--accent-fg:#0b1330;--bad:#ff6b5e;--bad-bg:#3a1b19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1017;--panel:#191c27;--fg:#ecebe6;--muted:#a09fa8;--line:#2b2f3f;--accent:#7ea2ff;--accent-fg:#0b1330;--bad:#ff6b5e;--bad-bg:#3a1b19;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font:700 26px var(--display);margin:0}
.pulse{margin:2px 0 0;color:var(--muted);font-size:14px}
.refresh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:disabled{opacity:.7;cursor:default}
:is(.btn,.banner,.x,.chip,.ctl button):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rnote{font-size:13px;color:var(--muted)}
.banner{font:inherit;text-align:left;width:100%;cursor:pointer;background:var(--bad-bg);color:var(--fg);border:1.5px solid var(--bad);border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.banner b{color:var(--bad)}
.bang{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-weight:800;display:grid;place-items:center}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:7px}
.ring{width:14px;height:14px;border-radius:50%;border:3px solid;flex:none}
.stage{position:relative;height:clamp(420px,66vh,820px);border-radius:18px;overflow:hidden;background:#0b0e1a}
.stage canvas#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
.stage canvas#map:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
#mini{position:absolute;left:10px;bottom:10px;border-radius:10px;border:2px solid #fffaf0;box-shadow:0 4px 14px rgba(0,0,0,.35);touch-action:none;cursor:pointer}
.ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
.ctl button{font:600 22px/1 var(--body);width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.2);background:rgba(20,24,42,.85);color:#fff;cursor:pointer;padding:0}
.ctl{z-index:2}
@media (max-width:520px){#zin,#zout{display:none}.sheet .do{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#s-ts{display:none}.sheet .in{padding:10px 12px}.sheet .sw{width:40px;height:40px;font-size:16px;border-width:4px}.ctl button{width:38px;height:38px;font-size:18px;border-radius:11px;opacity:.9}}
.hint{position:absolute;left:10px;top:10px;padding:7px 12px;border-radius:99px;background:rgba(20,24,42,.85);color:#fff;font-size:12.5px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipgroup{flex:0 0 100%;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:flex;gap:8px;align-items:center}
.chipgroup i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip{font:inherit;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:7px 11px;cursor:pointer;min-width:0;text-align:left}
.chip b{font-size:14px;display:flex;gap:7px;align-items:center}.chip small{font-size:12px;color:var(--muted)}.chip.need{border-color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.sheet .in{pointer-events:auto;width:100%;max-width:560px;max-height:26vh;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sheet .sw{flex:none;width:52px;height:52px;border-radius:50%;border:5px solid;display:grid;place-items:center;font:700 20px var(--display);color:#fff}
.sheet .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sheet .nm{font:700 18px var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:700 12px var(--body);padding:2px 9px;border-radius:99px;color:#fff}
.sheet .dp{color:var(--muted);font-size:13px}.sheet .do{font-size:14px;line-height:1.35}
.x{flex:none;align-self:flex-start;font:inherit;font-size:20px;line-height:1;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
</style>
<div class="wrap">
 <div class="head"><div><h1>Office</h1><p class="pulse" id="pulse">Loading…</p></div>
  <div class="refresh"><span class="rnote" id="rnote" aria-live="polite"></span><button class="btn" id="refresh" type="button">Refresh</button></div></div>
 <div id="banners"></div>
 <div class="key" aria-label="What the rings mean"><span><i class="ring" style="border-color:#ff3b30"></i>Needs you</span><span><i class="ring" style="border-color:#2f9bff"></i>Working</span><span><i class="ring" style="border-color:#35b56a"></i>Finished, on a break</span><span><i class="ring" style="border-color:#9aa0b4"></i>Quiet</span></div>
 <div class="stage" id="stage"><canvas id="map" tabindex="0" role="img" aria-label="Map of the office. Each department is its own district. Drag to move, pinch or scroll to zoom. Everyone is listed below."></canvas>
  <canvas id="mini" width="260" height="170" aria-hidden="true"></canvas>
  <div class="ctl"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="See the whole map">⤢</button></div>
  <div class="hint" id="hint">Drag to move · pinch to zoom · tap anyone</div></div>
 <div class="chips" id="chips"></div>
 <p class="note">Each room is a department. Tap anyone, or a name above, to fly to them. A new staff session gets a desk by itself. Refresh asks the manager to update everyone.</p>
</div>
<div class="sheet" id="sheet" hidden><div class="in"><div class="sw" id="s-sw"></div><div class="tx"><div class="nm" id="s-nm"></div><div class="dp" id="s-dp"></div><div class="do" id="s-do"></div><div class="dp" id="s-ts"></div></div><button class="x" id="s-x" type="button" aria-label="Close">×</button></div></div>
